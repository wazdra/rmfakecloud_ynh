#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]

    # Tests are deduced from the manifest; these check the app actually works.

    [default.curl_tests]

    # also proves the UI was built and embedded into the binary
    home.path = "/"
    home.expect_title = "rmfakecloud"
    home.auto_test_assets = true

    # proves NGINX reaches the upstream
    health.path = "/health"
    health.expect_content = "Working"

    # what a device asks for first, with no SSO round-trip
    discovery.path = "/discovery/v1/endpoints"
    discovery.expect_content = "webapp"

[INCLUDES]
before = common.conf

[Definition]
# A failed login is a 401 on POST /ui/api/login. Anchored on <HOST> at the start
# of the line so the banned address is NGINX's own field, not anything a client
# can put in the request.
failregex = ^<HOST> -.*"POST /ui/api/login HTTP/\d\.\d" 401
ignoreregex =

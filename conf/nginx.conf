# Included inside the server{} block of __DOMAIN__.
# Everything stays inside a location: server-level directives would also apply
# to YunoHost's own /yunohost/ and /.well-known/ locations.

location / {
  proxy_pass http://127.0.0.1:__PORT__;
  # required for proxy_request_buffering off
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  client_max_body_size 200M;
  # stream uploads instead of spooling them to disk
  proxy_request_buffering off;

  # response buffering deliberately left on, and no timeout overrides here:
  # worker_connections is shared with every other app on the instance
}

# The app's only two websocket endpoints. It sends no keepalive on them, so an
# idle socket needs a long read timeout -- scoped to these exact paths.

location = /notifications/ws/json/1 {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_buffering off;
  proxy_read_timeout 1d;
}

location = /mqtt {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_buffering off;
  proxy_read_timeout 1d;
}

# This file is included inside the `server {}` block of __DOMAIN__ only, so
# nothing here can affect another domain.
#
# Two rules are deliberately followed below:
#  - every directive stays *inside* a location block. Directives valid in
#    `server` context (client_max_body_size, proxy_set_header, ...) would
#    otherwise also apply to the locations YunoHost declares itself for this
#    domain, such as /yunohost/ and /.well-known/acme-challenge/.
#  - timeouts are left at the NGINX defaults everywhere except the two
#    websocket endpoints. Long timeouts pin worker connections, and
#    worker_connections is a single pool shared by every app on the instance.
#
# rmfakecloud owns the domain root, but NGINX always selects the longest
# matching prefix, so YunoHost's own locations keep priority over `location /`.

location / {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # Documents are uploaded in a single request. Streaming them straight to the
  # app avoids NGINX spooling a few hundred MB into /var/lib/nginx.
  client_max_body_size 200M;
  proxy_request_buffering off;

  # Response buffering is intentionally left ON: it releases the upstream
  # connection as soon as the app has answered, instead of holding a goroutine
  # open for the whole time a slow client takes to read the response.
}

# Websockets. These are the only two upgrade points in the app
# (internal/app/handlers.go), and the server sends no ping/keepalive on them
# (internal/app/hub/hub.go), so an idle notification socket would be dropped
# after the default 60s. The long read timeout is scoped to these two exact
# paths so that no other request can hold a worker connection open for a day.

location = /notifications/ws/json/1 {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_buffering off;
  proxy_read_timeout 1d;
}

location = /mqtt {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_buffering off;
  proxy_read_timeout 1d;
}
